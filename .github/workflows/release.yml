name: Release

# Every push to main publishes a version: a vX.Y.Z tag, a GitHub release and
# the npm package @sostag/scraping-bot-mcp, chosen from the commit messages (feat -> minor, fix and others -> patch,
# "!" or BREAKING CHANGE -> major). Nothing is committed to main: the tag
# points to a version commit made next to it, so nobody has to pull.
# Skipped for documentation-only pushes and with [skip release] in the
# last commit message.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "test/**"

permissions:
  contents: write
  # npm provenance: the package is linked to the commit and workflow that built it
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    env:
      # a step's "if" cannot read secrets: say whether the npm token exists
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout with history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install, build and test
        run: |
          npm ci
          npm test

      - name: Compute the next version
        id: next
        run: node scripts/next-release.mjs "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag the version
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit --quiet -am "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

      # package.json carries the version set by "Tag the version"; dist/ was
      # built by npm test. Skipped until the NPM_TOKEN secret exists.
      - name: Publish to npm
        if: steps.next.outputs.version != '' && env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
