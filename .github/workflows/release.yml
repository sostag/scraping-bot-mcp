name: Release

# Every push to main publishes a version: a vX.Y.Z tag, a GitHub release and
# the npm package @sostag/scraping-bot-mcp, chosen from the commit messages (feat -> minor, fix and others -> patch,
# "!" or BREAKING CHANGE -> major). Nothing is committed to main: the tag
# points to a version commit made next to it, so nobody has to pull.
# Skipped for documentation-only pushes and with [skip release] in the
# last commit message.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "test/**"

permissions:
  contents: write
  # npm Trusted Publishing and provenance: npm trusts this workflow's OIDC token
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout with history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install, build and test
        run: |
          npm ci
          npm run secretlint
          npm test

      - name: Compute the next version
        id: next
        run: node scripts/next-release.mjs "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      # Tagged here, pushed only once npm has the version: a failed publish
      # leaves no tag behind, so running the workflow again retries it.
      - name: Set the version
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit --quiet -am "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      # Claude Desktop extension, attached to the GitHub release (built before
      # publishing, so that a failure leaves nothing published)
      - name: Build the Claude Desktop extension
        if: steps.next.outputs.version != ''
        run: node scripts/build-mcpb.mjs "$RUNNER_TEMP/scraping-bot.mcpb"

      # Trusted Publishing (npm package settings: GitHub Actions,
      # sostag/scraping-bot-mcp, release.yml): npm trusts this workflow
      # through its OIDC token (id-token: write), no npm token is stored, and
      # the provenance is added. Needs npm 11.5.1 or later.
      - name: Publish to npm
        if: steps.next.outputs.version != ''
        run: |
          npm install --global npm@^11.5.1
          npm publish

      - name: Push the tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: gh release create "v$VERSION" "$RUNNER_TEMP/scraping-bot.mcpb" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

  # Remote (HTTP) mode: image of the released version, pushed to the
  # DigitalOcean registry; the App Platform app (.do/app.yaml) follows the
  # "latest" tag. A separate job, so that it can be run again on its own.
  deploy-http:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      IMAGE: registry.digitalocean.com/scrapresgistry/scraping-bot-mcp
      # a step's "if" cannot read secrets: say whether the token exists
      HAS_DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
    steps:
      - name: Checkout the release
        if: env.HAS_DO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install doctl
        if: env.HAS_DO_TOKEN == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push the image
        if: env.HAS_DO_TOKEN == 'true'
        run: |
          doctl registry login --expiry-seconds 1200
          # One plain image (no attestation manifests cluttering the registry)
          docker build --provenance=false --sbom=false -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
